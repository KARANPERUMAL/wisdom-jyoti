# ==========================================
# Server Configuration
# ==========================================
server.port=${PORT:8085}

# ==========================================
# Database Configuration (Neon PostgreSQL / Local H2 fallback)
# ==========================================
# When deploying on Render with Neon PostgreSQL, provide:
# SPRING_DATASOURCE_URL=jdbc:postgresql://ep-xxx.neon.tech/neondb?sslmode=require
# SPRING_DATASOURCE_USERNAME=neondb_owner
# SPRING_DATASOURCE_PASSWORD=your_neon_password
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:wisdomjyotidb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Driver is auto-detected by Spring Boot based on JDBC URL

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console (Available locally at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Resend Email Configuration
# ==========================================
# Resend API runs over HTTPS (port 443), fully compatible with Render Free
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Wisdom Jyoti <onboarding@resend.dev>}
resend.manager.email=${MANAGER_EMAIL:karanperumaln@gmail.com}
resend.mail.enabled=${MAIL_ENABLED:true}

# Excel Attachment Filename
resend.excel.filename=wisdom-jyoti-enquiries.xlsx

# ==========================================
# CORS Configuration
# ==========================================
# Comma-separated list of allowed origins (e.g. Vercel frontend domain)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
